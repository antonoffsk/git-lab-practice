
name: Проверка проекта

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  basic-check:
    name: basic-check
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы проекта
        uses: actions/checkout@v7

      - name: Проверить основные файлы
        run: |
          test -f "описание-проекта.txt"
          test -f "первый-файл.txt"
          test -f "второй-файл.txt"
          test -f ".gitignore"
          echo "Все основные файлы найдены"

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Получить историю проекта
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Проверить проект на секреты
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
