name: Проверка проекта

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  basic-check:
    name: basic-check
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы проекта
        uses: actions/checkout@v7

      - name: Проверить основные файлы
        run: |
          test -f "описание-проекта.txt"
          test -f "первый-файл.txt"
          test -f "второй-файл.txt"
          test -f ".gitignore"
          echo "Все основные файлы найдены"

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы проекта
        uses: actions/checkout@v7

      - name: Подготовить проект
        run: |
          mkdir -p /tmp/project-to-scan
          tar --exclude=.git -cf - . | tar -xf - -C /tmp/project-to-scan
          cat > /tmp/trufflehog-config.yaml <<'EOF'
          detectors:
            - name: ClassroomMarker
              keywords:
                - LAB_DEMO_PATTERN
              regex:
                marker: 'LAB_DEMO_PATTERN=([a-z-]{20,})'
          EOF

      - name: Проверить проект на секреты
        run: |
          docker run --rm \
            -v /tmp/project-to-scan:/repo \
            -v /tmp/trufflehog-config.yaml:/tmp/trufflehog-config.yaml \
            ghcr.io/trufflesecurity/trufflehog:latest \
            filesystem /repo \
            --config=/tmp/trufflehog-config.yaml \
            --no-verification \
            --results=verified,unverified,unknown \
            --fail